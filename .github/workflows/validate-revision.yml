name: Validate ODS Revision

on:
  push:
    branches:
      - 'claude/*'
    paths:
      - '.github/data/validate-revisions.json'
      - '.github/scripts/validate-ods-revision.py'
      - '.github/workflows/validate-revision.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lxml
        run: pip install lxml

      - name: Run validations
        run: |
          CONFIG=".github/data/validate-revisions.json"
          if [ ! -f "$CONFIG" ]; then
            echo "No validation config found at $CONFIG"
            exit 0
          fi

          python3 << 'PYEOF'
          import json
          import os
          import sys
          import subprocess

          with open(".github/data/validate-revisions.json") as f:
              validations = json.load(f)

          print(f"Running {len(validations)} validations...\n")

          results = []
          for i, v in enumerate(validations):
              sheet = v["sheet"]
              rev = v["rev"]
              gc_file = v["gc"]
              label = v.get("label", f"{sheet}-rev{rev}")

              print(f"\n{'='*60}")
              print(f"Validation {i+1}: {label}")
              print(f"  Sheet: {sheet}, Rev: {rev}, GC: {gc_file}")
              print(f"{'='*60}\n")

              proc = subprocess.run(
                  ["python3", ".github/scripts/validate-ods-revision.py",
                   "--sheet", sheet,
                   "--rev", str(rev),
                   "--gc-file", gc_file,
                   "--download-dir", "/tmp/ods-validation"],
                  capture_output=False
              )

              results.append({
                  "label": label,
                  "sheet": sheet,
                  "rev": rev,
                  "gc": gc_file,
                  "passed": proc.returncode == 0,
              })

          print(f"\n{'='*60}")
          print("SUMMARY")
          print(f"{'='*60}")
          all_pass = True
          for r in results:
              status = "PASS" if r["passed"] else "FAIL"
              if not r["passed"]:
                  all_pass = False
              print(f"  [{status}] {r['label']}: {r['sheet']} rev-{r['rev']} vs {r['gc']}")

          # Write results for summary step
          with open("/tmp/validation-results.json", "w") as f:
              json.dump(results, f, indent=2)

          if not all_pass:
              sys.exit(1)
          PYEOF
        env:
          PYTHONUNBUFFERED: "1"

      - name: Summary
        if: always()
        run: |
          {
            echo "## ODS Revision Validation Results"
            echo ""
            if [ -f /tmp/validation-results.json ]; then
              echo "| Label | Sheet | Rev | GC File | Result |"
              echo "|-------|-------|-----|---------|--------|"
              python3 -c "
          import json
          results = json.load(open('/tmp/validation-results.json'))
          for r in results:
              status = ':white_check_mark: PASS' if r['passed'] else ':x: FAIL'
              print(f'| {r[\"label\"]} | {r[\"sheet\"]} | {r[\"rev\"]} | \`{r[\"gc\"]}\` | {status} |')
          "
            else
              echo "No results available"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
